<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Tính Lương 2026</title>
    
    <!-- Tải Tailwind CSS cho thiết kế linh hoạt -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tải Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #051c2e; /* Nền ngoài cùng tối hơn một chút */
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        /* Container chính của App */
        .app-container {
            background-color: #0a2a43;
            border: 2px solid #1e4b73;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 2px 0 rgba(255, 255, 255, 0.1);
        }

        /* Style cho các ô nhập liệu 3D */
        .input-3d {
            background-color: #113452;
            border: 2px solid #1e4b73;
            border-radius: 12px;
            color: #ffffff;
            box-shadow: 0 4px 0 #051829, inset 0 2px 4px rgba(0,0,0,0.2);
            transition: all 0.2s ease-in-out;
        }
        
        .input-3d:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 4px 0 #173d5e, inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .input-3d::placeholder {
            color: #6486a3;
        }

        /* Nút tính toán 3D nổi bật */
        .btn-3d {
            background: linear-gradient(145deg, #f59e0b, #d97706);
            border: 2px solid #b45309;
            box-shadow: 0 6px 0 #78350f, 0 10px 20px rgba(0,0,0,0.4);
            border-radius: 12px;
            transition: all 0.1s;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .btn-3d:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #78350f, 0 4px 6px rgba(0,0,0,0.4);
        }

        /* Khung kết quả 3D */
        .result-box {
            background-color: #0d3656;
            border: 2px solid #1e4b73;
            border-radius: 12px;
            box-shadow: 0 4px 0 #051829;
            transition: all 0.3s ease;
        }

        /* Ẩn hiện mượt mà */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loại bỏ mũi tên tăng giảm mặc định trên ô nhập số */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="app-container w-full max-w-[420px] rounded-2xl p-5 md:p-6 relative">
        
        <!-- Headers & Titles -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-yellow-400 mb-1 uppercase tracking-wide" style="text-shadow: 0 2px 4px rgba(0,0,0,0.5);">
                Công Cụ Tính Lương 2026
            </h1>
            <p class="text-xs text-blue-200 mb-1 font-medium">
                NĐ 381 CB cấp xã - NĐ 350 NV y tế - NĐ 182 giáo viên
            </p>
            <p class="text-[11px] text-blue-300/80 italic">
                Phát triển bởi thầy Đinh Như Huy - 
                <a href="https://www.facebook.com/mcnhuhuy" target="_blank" class="text-blue-400 hover:text-blue-300 underline underline-offset-2">
                    fb.com/mcnhuhuy
                </a>
            </p>
        </div>

        <form id="salaryForm" class="space-y-4 pb-2" onsubmit="event.preventDefault(); calculateSalary();">
            
            <!-- 1. Lương cơ sở -->
            <div>
                <label for="baseWage" class="block text-sm font-semibold text-blue-200 mb-1">1. Lương cơ sở</label>
                <select id="baseWage" class="input-3d w-full px-4 py-3 text-base appearance-none cursor-pointer">
                    <option value="2340000">2.340.000 VNĐ</option>
                    <option value="2530000">2.530.000 VNĐ</option>
                </select>
            </div>

            <!-- 2. Đối tượng hưởng lương -->
            <div>
                <label for="objType" class="block text-sm font-semibold text-blue-200 mb-1">2. Đối tượng hưởng lương</label>
                <select id="objType" class="input-3d w-full px-4 py-3 text-base appearance-none cursor-pointer">
                    <option value="gv">Giáo viên/NV Giáo dục (NĐ 182)</option>
                    <option value="yt">Nhân viên Y tế (NĐ 350)</option>
                    <option value="cx">Cán bộ cấp xã (NĐ 381)</option>
                </select>
            </div>

            <!-- 3. Phụ cấp ưu đãi / công vụ (%) -->
            <!-- Mức phụ cấp này sẽ được tự động render bằng JS dựa trên đối tượng -->
            <div>
                <label for="pcudCv" class="block text-sm font-semibold text-blue-200 mb-1">3. Phụ cấp Ưu đãi/Công vụ (%)</label>
                <select id="pcudCv" class="input-3d w-full px-4 py-3 text-base appearance-none cursor-pointer">
                    <!-- Options populated by JS -->
                </select>
            </div>

            <!-- 4 & 5. Hệ số lương và Chức vụ -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="hsl" class="block text-sm font-semibold text-blue-200 mb-1">4. Hệ số lương</label>
                    <input type="number" id="hsl" step="0.01" min="0" placeholder="VD: 2.34" required
                           class="input-3d w-full px-4 py-3 text-base font-semibold text-center">
                </div>
                <div>
                    <label for="pccv" class="block text-sm font-semibold text-blue-200 mb-1">5. PC Chức vụ</label>
                    <input type="number" id="pccv" step="0.01" min="0" placeholder="VD: 0.2"
                           class="input-3d w-full px-4 py-3 text-base font-semibold text-center">
                </div>
            </div>

            <!-- 6 & 7. Phụ cấp thâm niên và Vượt khung -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="pctnNghe" class="block text-sm font-semibold text-blue-200 mb-1">6. PC Thâm niên (%)</label>
                    <input type="number" id="pctnNghe" step="1" min="0" placeholder="VD: 15"
                           class="input-3d w-full px-4 py-3 text-base font-semibold text-center">
                </div>
                <div>
                    <label for="pctnVk" class="block text-sm font-semibold text-blue-200 mb-1">7. PC Vượt khung (%)</label>
                    <input type="number" id="pctnVk" step="1" min="0" placeholder="VD: 5"
                           class="input-3d w-full px-4 py-3 text-base font-semibold text-center">
                </div>
            </div>

            <!-- 8. Phụ cấp khu vực -->
            <div>
                <label for="pckv" class="block text-sm font-semibold text-blue-200 mb-1">8. PC Khu vực (Hệ số)</label>
                <input type="number" id="pckv" step="0.1" min="0" placeholder="VD: 0.1 (Nếu không có để trống)"
                       class="input-3d w-full px-4 py-3 text-base font-semibold">
            </div>

            <div class="pt-2 pb-2">
                <button type="submit" class="btn-3d w-full py-4 text-center font-bold text-lg text-white uppercase tracking-wider block">
                    Tính Toán Lương
                </button>
            </div>
        </form>

        <div id="resultArea" class="hidden mt-4 pt-4 border-t border-[#1e4b73] fade-in">
            <h2 class="text-center font-bold text-yellow-400 mb-4 uppercase text-sm tracking-widest">Kết quả chi tiết</h2>
            
            <div class="space-y-3">
                <!-- Lương cơ bản -->
                <div class="result-box p-3 flex justify-between items-center">
                    <span class="text-blue-200 text-sm font-medium">Lương cơ bản</span>
                    <span id="resCoBan" class="font-bold text-white">0 đ</span>
                </div>
                
                <!-- Tổng lương (Gross) -->
                <div class="result-box p-3 flex justify-between items-center">
                    <span class="text-blue-200 text-sm font-medium">Tổng lương (Gross)</span>
                    <span id="resGross" class="font-bold text-white">0 đ</span>
                </div>
                
                <!-- Trừ BHXH -->
                <div class="result-box p-3 flex justify-between items-center">
                    <span class="text-red-400 text-sm font-medium">Trừ BHXH (10.5%)</span>
                    <span id="resBhxh" class="font-bold text-red-400">- 0 đ</span>
                </div>
                
                <!-- Thực nhận (Net) -->
                <div class="result-box p-4 flex justify-between items-center bg-[#10436d] border-green-500/50 shadow-[0_4px_0_#06233d]">
                    <span class="text-green-300 font-bold uppercase">Thực nhận (Net)</span>
                    <span id="resNet" class="font-black text-xl text-yellow-400">0 đ</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Dữ liệu phụ cấp ưu đãi/công vụ theo đối tượng (dựa trên các Nghị định)
        const allowancesData = {
            'gv': [20, 25, 30, 35, 40, 45, 60, 70, 80], // Giáo viên (NĐ 182)
            'yt': [30, 40, 50, 60, 70, 80],             // Y tế (NĐ 350)
            'cx': [25, 55]                              // Cán bộ xã (NĐ 381)
        };

        // DOM Elements
        const objTypeSelect = document.getElementById('objType');
        const pcudCvSelect = document.getElementById('pcudCv');
        const resultArea = document.getElementById('resultArea');

        // Hàm cập nhật dropdown phụ cấp dựa trên đối tượng đã chọn
        function updateAllowanceDropdown() {
            const selectedType = objTypeSelect.value;
            const options = allowancesData[selectedType];
            
            // Xóa các options cũ
            pcudCvSelect.innerHTML = '';
            
            // Thêm options mới
            options.forEach(val => {
                const opt = document.createElement('option');
                opt.value = val;
                opt.textContent = `${val}%`;
                pcudCvSelect.appendChild(opt);
            });
        }

        // Lắng nghe sự kiện thay đổi đối tượng
        objTypeSelect.addEventListener('change', updateAllowanceDropdown);
        
        // Cập nhật giá trị khởi tạo khi trang load
        document.addEventListener('DOMContentLoaded', () => {
            updateAllowanceDropdown();
        });

        // Hàm format tiền tệ (VNĐ)
        function formatVND(number) {
            return Math.round(number).toLocaleString('vi-VN') + ' đ';
        }

        function calculateSalary() {
            // Lấy giá trị từ inputs (mặc định là 0 nếu người dùng bỏ trống)
            const baseWage = parseFloat(document.getElementById('baseWage').value) || 0;
            const hsl = parseFloat(document.getElementById('hsl').value) || 0;
            const pccv = parseFloat(document.getElementById('pccv').value) || 0;
            const pctnNghe = parseFloat(document.getElementById('pctnNghe').value) || 0;
            const pctnVk = parseFloat(document.getElementById('pctnVk').value) || 0;
            const pckv = parseFloat(document.getElementById('pckv').value) || 0;
            const pcudCv = parseFloat(document.getElementById('pcudCv').value) || 0;

            if (hsl === 0) {
                alert("Vui lòng nhập hệ số lương hợp lệ!");
                return;
            }

            // 1. Tính các khoản cấu thành tiền
            const tienLuongCoBan = hsl * baseWage;
            const tienPccv = pccv * baseWage;
            const tienVk = tienLuongCoBan * (pctnVk / 100);
            const tienPckv = pckv * baseWage;

            // 2. Base tính phụ cấp theo % (Lương + Phụ cấp CV + Phụ cấp Vượt khung)
            const baseForAllowances = tienLuongCoBan + tienPccv + tienVk;
            
            // Tính số tiền phụ cấp phần trăm
            const tienPcudCv = baseForAllowances * (pcudCv / 100);
            const tienPctnNghe = baseForAllowances * (pctnNghe / 100);

            // 3. Tính tiền đóng BHXH
            // Base BHXH = Lương + PC Chức Vụ + PC Vượt Khung + PC Thâm Niên Nghề
            const bhxhBase = tienLuongCoBan + tienPccv + tienVk + tienPctnNghe;
            const bhxh = bhxhBase * 0.105; // Đóng 10.5% (8% Hưu trí + 1.5% BHYT + 1% BHTN)

            // 4. Tính Tổng thu nhập (Gross) & Thực nhận (Net)
            const gross = tienLuongCoBan + tienPccv + tienVk + tienPckv + tienPcudCv + tienPctnNghe;
            const net = gross - bhxh;

            // Hiển thị ra UI
            document.getElementById('resCoBan').textContent = formatVND(tienLuongCoBan);
            document.getElementById('resGross').textContent = formatVND(gross);
            document.getElementById('resBhxh').textContent = "- " + formatVND(bhxh);
            document.getElementById('resNet').textContent = formatVND(net);

            // Hiển thị khối kết quả
            resultArea.classList.remove('hidden');
            
            // Xóa animation cũ nếu có để trigger lại
            resultArea.classList.remove('fade-in');
            void resultArea.offsetWidth; // Trigger reflow
            resultArea.classList.add('fade-in');
            
            // Cuộn xuống kết quả cho màn hình nhỏ
            setTimeout(() => {
                resultArea.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 100);
        }
    </script>
</body>
</html>
